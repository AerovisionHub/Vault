<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Compare QA</title>
<style>body{font-family:monospace;background:#0f1240;color:#fff;padding:24px;max-width:900px;margin:0 auto;}
.r{background:rgba(255,255,255,0.05);padding:8px 12px;border-radius:6px;margin:4px 0;font-size:12px;line-height:1.6;}
.pass{color:#4ade80;} .fail{color:#f87171;} .warn{color:#fbbf24;}
h3{color:#4db8ff;margin:14px 0 6px;font-size:13px;}
#summary{font-size:15px;padding:12px;border-radius:8px;margin:12px 0;font-weight:700;}</style>
</head><body>
<h2 style="color:#4db8ff">Compare Feature QA — Sequential</h2>
<p style="color:#9ca3af;font-size:11px;">Tests run sequentially with delays to avoid FDIC rate limiting (mimics real user behavior — comparing 2-3 institutions at a time, not 6 rapid-fire).</p>
<div id="summary"></div>
<div id="out"></div>
<script>
const FDIC = 'https://banks.data.fdic.gov/api';
const NCUA_PROXY = '/.netlify/functions/ncua';
let pass=0, fail=0;

function record(ok, label, detail) {
  const out = document.getElementById('out');
  if (ok) pass++; else fail++;
  const cls = ok?'pass':'fail';
  const sym = ok?'✓':'✗';
  out.innerHTML += `<div class="r ${cls}">${sym} ${label}${detail?'<br><span style="color:#9ca3af">'+detail+'</span>':''}</div>`;
}

async function fetchBank(cert) {
  const finFields = 'REPDTE,ASSET,DEP,EQ,NETINC,RBC1AAJ,ROA,ROE,NIMY,LNLSDEPR,NUMEMP';
  const instFields = 'NAME,CERT,CITY,STALP,ASSET,DEP,WEBADDR,ESTYMD,INSTCAT';
  const [iR, fR] = await Promise.all([
    fetch(`${FDIC}/institutions?filters=CERT%3A${cert}&fields=${instFields}&limit=1`).then(r=>r.json()),
    fetch(`${FDIC}/financials?filters=CERT%3A${cert}&fields=${finFields}&limit=1&sort_by=REPDTE&sort_order=DESC`).then(r=>r.json()),
  ]);
  return { inst: iR.data?.[0]?.data, latest: fR.data?.[0]?.data || {} };
}

async function fetchCU(id, name) {
  try {
    const d = await fetch(`${NCUA_PROXY}?q=${encodeURIComponent(name)}&limit=5`).then(r=>r.json());
    return d.results?.find(r => String(r.id) === String(id)) || d.results?.[0] || null;
  } catch(e) { return null; }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  const out = document.getElementById('out');

  out.innerHTML += `<h3>Test 1: Single bank fetch</h3>`;
  const b1 = await fetchBank(23473);
  record(!!b1?.inst?.NAME, 'Fetch CERT 23473', `Name: ${b1?.inst?.NAME} · ROA: ${b1?.latest?.ROA?.toFixed(2)}%`);
  await sleep(300);

  out.innerHTML += `<h3>Test 2: Three banks fetched (typical use case)</h3>`;
  const t0 = Date.now();
  const banks3 = await Promise.all([fetchBank(4063), fetchBank(5962), fetchBank(23473)]);
  const ms = Date.now()-t0;
  const allHaveInst = banks3.every(b => !!b?.inst?.NAME);
  const allHaveLatest = banks3.every(b => !!b?.latest?.ROA);
  record(allHaveInst, '3 banks return inst data', `${ms}ms — names: ${banks3.map(b=>b?.inst?.NAME?.split(' ')[0]).join(', ')}`);
  record(allHaveLatest, '3 banks return financial data', `ROAs: ${banks3.map(b=>b?.latest?.ROA?.toFixed(2)+'%').join(', ')}`);
  record(ms < 5000, 'Performance OK (<5s)', `${ms}ms`);
  await sleep(500);

  out.innerHTML += `<h3>Test 3: Bank + CU hybrid</h3>`;
  const [bA, cA] = await Promise.all([fetchBank(4063), fetchCU(5536, 'Navy Federal')]);
  record(!!(bA?.inst && cA?.name), 'Bank + CU together', `${bA?.inst?.NAME} + ${cA?.name}`);
  await sleep(500);

  out.innerHTML += `<h3>Test 4: Metric extraction from real data</h3>`;
  const b4 = await fetchBank(5962); // Sutton — high ROA
  const roa = Number(b4?.latest?.ROA);
  const assets = Number(b4?.inst?.ASSET);
  record(!isNaN(roa) && roa > 0, 'ROA is numeric and positive', `${roa.toFixed(2)}%`);
  record(!isNaN(assets) && assets > 0, 'Assets is numeric and positive', `$${(assets/1000).toFixed(0)}M`);
  record(b4?.inst?.WEBADDR != null || b4?.inst?.WEBADDR === '', 'WEBADDR field present', b4?.inst?.WEBADDR || '(empty)');
  await sleep(500);

  out.innerHTML += `<h3>Test 5: Best-in-class detection logic</h3>`;
  const banks5 = await Promise.all([fetchBank(4063), fetchBank(5962), fetchBank(23473)]);
  const vals = banks5.map(b => Number(b?.latest?.ROA)).filter(v => !isNaN(v) && v > 0);
  const best = Math.max(...vals);
  record(vals.length === 3, 'All 3 ROA values present', `[${vals.map(v=>v.toFixed(2)).join(', ')}]`);
  record(best === Math.max(...vals), 'Math.max picks best ROA', `Best: ${best.toFixed(2)}%`);
  const lowVals = banks5.map(b => Number(b?.latest?.LNLSDEPR)).filter(v => !isNaN(v));
  const bestLow = Math.min(...lowVals);
  record(lowVals.length === 3, 'All 3 delinquency values present', `[${lowVals.map(v=>v.toFixed(2)).join(', ')}]`);
  record(bestLow === Math.min(...lowVals), 'Math.min picks lowest delinquency', `Best (low): ${bestLow.toFixed(2)}%`);
  await sleep(500);

  out.innerHTML += `<h3>Test 6: Edge cases</h3>`;
  const b6 = await fetchBank(59363);
  // CERT 59363 has no institution record but does have financials
  record(b6?.inst === undefined, 'CERT 59363 — no inst record (expected)', `inst: ${b6?.inst===undefined?'undefined ✓':'unexpected'}`);
  // latest could be {} (empty object) if no financials, or have data
  const hasLatestObj = typeof b6?.latest === 'object' && b6?.latest !== null;
  record(hasLatestObj, 'CERT 59363 — latest is object (graceful)', `latest: ${JSON.stringify(b6?.latest).slice(0,80)}`);
  await sleep(300);
  const b7 = await fetchBank(999999);
  record(b7?.inst === undefined, 'Invalid CERT returns undefined inst', `inst: ${b7?.inst}`);

  out.innerHTML += `<h3>Test 7: Routing</h3>`;
  record(window.location.pathname === '/compare-test.html', 'Test page loads', `${window.location.pathname}`);
  try {
    const r = await fetch('/compare', { method: 'HEAD' });
    record(r.ok, '/compare URL accessible', `Status: ${r.status}`);
  } catch(e) { record(false, '/compare URL test failed', e.message); }

  out.innerHTML += `<h3>Test 8: State management</h3>`;
  const list = [];
  ['1','2','3','4'].forEach(id => {
    const key = `bank:${id}`;
    if (!list.find(i => i.key === key)) {
      if (list.length >= 3) list.shift();
      list.push({ key, cert: id, type: 'bank' });
    }
  });
  record(list.length === 3, 'Max 3 enforcement', `Final: ${list.map(i=>i.cert).join(',')}`);
  const dedup = [];
  ['1','1','1'].forEach(id => {
    const key = `bank:${id}`;
    if (!dedup.find(i => i.key === key)) dedup.push({ key, cert: id });
  });
  record(dedup.length === 1, 'Duplicate prevention', `Size: ${dedup.length}`);

  const total = pass + fail;
  const pct = Math.round(pass/total*100);
  const c = fail===0?'#4ade80':pct>=80?'#fbbf24':'#f87171';
  const bg = fail===0?'rgba(74,222,128,0.1)':pct>=80?'rgba(251,191,36,0.1)':'rgba(248,113,113,0.1)';
  document.getElementById('summary').style.cssText = `background:${bg};border:1px solid ${c};padding:14px;border-radius:8px;`;
  document.getElementById('summary').innerHTML = `<span style="color:${c}">${pass}/${total} passed${fail?` · ${fail} failed`:''} (${pct}%)</span>`;
}
run();
</script></body></html>
