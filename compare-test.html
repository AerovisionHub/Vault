<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Compare QA</title>
<style>body{font-family:monospace;background:#0f1240;color:#fff;padding:24px;max-width:900px;margin:0 auto;}
.r{background:rgba(255,255,255,0.05);padding:8px 12px;border-radius:6px;margin:4px 0;font-size:12px;line-height:1.6;}
.pass{color:#4ade80;} .fail{color:#f87171;} .warn{color:#fbbf24;}
h3{color:#4db8ff;margin:14px 0 6px;font-size:13px;}
#summary{font-size:15px;padding:12px;border-radius:8px;margin:12px 0;font-weight:700;}</style>
</head><body>
<h2 style="color:#4db8ff">Compare Feature QA</h2>
<div id="summary"></div>
<div id="out"></div>
<script>
const FDIC = 'https://banks.data.fdic.gov/api';
const NCUA_PROXY = '/.netlify/functions/ncua';
let pass=0, fail=0, warn=0;

function record(ok, label, detail) {
  const out = document.getElementById('out');
  if (ok===true) pass++;
  else if (ok==='warn') warn++;
  else fail++;
  const cls = ok===true?'pass':ok==='warn'?'warn':'fail';
  const sym = ok===true?'✓':ok==='warn'?'⚠':'✗';
  out.innerHTML += `<div class="r ${cls}">${sym} ${label}${detail?'<br><span style="color:#9ca3af">'+detail+'</span>':''}</div>`;
}

async function fetchBank(cert) {
  const finFields = 'REPDTE,ASSET,DEP,EQ,NETINC,RBC1AAJ,ROA,ROE,NIMY,LNLSDEPR,NUMEMP';
  const instFields = 'NAME,CERT,CITY,STALP,ASSET,DEP,WEBADDR,ESTYMD,INSTCAT';
  try {
    const [iR, fR] = await Promise.all([
      fetch(`${FDIC}/institutions?filters=CERT%3A${cert}&fields=${instFields}&limit=1`).then(r=>r.json()),
      fetch(`${FDIC}/financials?filters=CERT%3A${cert}&fields=${finFields}&limit=1&sort_by=REPDTE&sort_order=DESC`).then(r=>r.json()),
    ]);
    return { inst: iR.data?.[0]?.data, latest: fR.data?.[0]?.data || {} };
  } catch(e) { return null; }
}

async function fetchCU(id, name) {
  try {
    const d = await fetch(`${NCUA_PROXY}?q=${encodeURIComponent(name)}&limit=5`).then(r=>r.json());
    return d.results?.find(r => String(r.id) === String(id)) || d.results?.[0] || null;
  } catch(e) { return null; }
}

async function run() {
  const out = document.getElementById('out');

  out.innerHTML += `<h3>Test 1: Single bank data fetch</h3>`;
  const b1 = await fetchBank(23473); // First Fidelity Bank
  record(!!b1?.inst?.NAME, 'Fetch CERT 23473', `Name: ${b1?.inst?.NAME||'FAIL'} · ROA: ${b1?.latest?.ROA?.toFixed(2)||'—'}%`);

  out.innerHTML += `<h3>Test 2: Three banks parallel (typical use case)</h3>`;
  const t0 = Date.now();
  const [b2a, b2b, b2c] = await Promise.all([fetchBank(4063), fetchBank(5962), fetchBank(23473)]);
  const ms = Date.now()-t0;
  record(!!(b2a?.inst && b2b?.inst && b2c?.inst), '3 banks fetched in parallel', `${ms}ms — MidFirst, Sutton, First Fidelity`);
  record(ms < 5000, 'Performance OK (<5s)', `${ms}ms`);

  out.innerHTML += `<h3>Test 3: Bank + CU hybrid comparison</h3>`;
  const [b3, c3] = await Promise.all([fetchBank(4063), fetchCU(5536, 'Navy Federal')]);
  record(!!(b3?.inst && c3?.name), 'Bank + CU together', `Bank: ${b3?.inst?.NAME} · CU: ${c3?.name}`);

  out.innerHTML += `<h3>Test 4: Metric value extraction</h3>`;
  if (b2a?.latest) {
    const roa = Number(b2a.latest.ROA);
    record(!!(!isNaN(roa) && roa > 0), 'ROA is numeric', `Value: ${roa}`);
    const assets = Number(b2a.inst?.ASSET);
    record(!!(!isNaN(assets) && assets > 0), 'Assets is numeric', `$${(assets/1000).toFixed(0)}M`);
    record(!!(typeof b2a.inst.WEBADDR === 'string' || b2a.inst.WEBADDR === undefined), 'WEBADDR field accessible', b2a.inst.WEBADDR || '(none)');
  }

  out.innerHTML += `<h3>Test 5: Best-in-class detection logic</h3>`;
  // Re-fetch for Test 5 since b2a/b2b/b2c are out of scope here
  const fresh = await Promise.all([fetchBank(4063), fetchBank(5962), fetchBank(23473)]);
  const vals = fresh.map(b => Number(b?.latest?.ROA)).filter(v => !isNaN(v));
  const best = Math.max(...vals);
  record(!!(vals.length === 3 && best > 0), 'Math.max picks best ROA', `Values: [${vals.map(v=>v.toFixed(2)).join(', ')}] → best: ${best.toFixed(2)}%`);
  const lowVals = fresh.map(b => Number(b?.latest?.LNLSDEPR)).filter(v => !isNaN(v));
  const bestLow = Math.min(...lowVals);
  record(!!(lowVals.length > 0), 'Math.min picks lowest delinquency', `Values: [${lowVals.map(v=>v.toFixed(2)).join(', ')}] → best (low): ${bestLow.toFixed(2)}%`);

  out.innerHTML += `<h3>Test 6: Edge cases</h3>`;
  // Bank with sparse data (CERT 59363 — special purpose)
  const b6 = await fetchBank(59363);
  record(!!(b6 !== null), 'CERT 59363 (no inst record) handled gracefully', `inst: ${b6?.inst?'present':'null (expected)'} · latest: ${b6?.latest?'present':'missing'}`);
  // Invalid CERT
  const b7 = await fetchBank(999999);
  record(!!(b7?.inst === undefined), 'Invalid CERT returns null inst', `inst: ${b7?.inst===undefined?'undefined ✓':'unexpected'}`);

  out.innerHTML += `<h3>Test 7: URL routing</h3>`;
  record(!!(window.location.pathname === '/compare-test.html'), 'Direct page load works', `Path: ${window.location.pathname}`);
  // Test that /compare resolves
  try {
    const r = await fetch('/compare', { method: 'HEAD' });
    record(r.ok, '/compare URL accessible', `Status: ${r.status}`);
  } catch(e) { record(false, '/compare URL test failed', e.message); }

  out.innerHTML += `<h3>Test 8: State management simulation</h3>`;
  const compareList = [];
  // Simulate adding 4 items (max should be 3)
  ['1','2','3','4'].forEach(id => {
    const key = `bank:${id}`;
    if (!compareList.find(i => i.key === key)) {
      if (compareList.length >= 3) compareList.shift();
      compareList.push({ key, cert: id, type: 'bank' });
    }
  });
  record(!!(compareList.length === 3), 'Max 3 enforcement works', `Final list: ${compareList.map(i=>i.cert).join(',')} (oldest dropped)`);

  // Dedupe test
  const dedup = [];
  ['1','1','1'].forEach(id => {
    const key = `bank:${id}`;
    if (!dedup.find(i => i.key === key)) dedup.push({ key, cert: id });
  });
  record(!!(dedup.length === 1), 'Duplicate prevention works', `Same item added 3x → list size: ${dedup.length}`);

  const total = pass + fail + warn;
  const pct = Math.round(pass/total*100);
  const c = fail===0?'#4ade80':pct>=70?'#fbbf24':'#f87171';
  const bg = fail===0?'rgba(74,222,128,0.1)':pct>=70?'rgba(251,191,36,0.1)':'rgba(248,113,113,0.1)';
  document.getElementById('summary').style.cssText = `background:${bg};border:1px solid ${c};padding:14px;border-radius:8px;`;
  document.getElementById('summary').innerHTML = `<span style="color:${c}">${pass}/${total} passed${fail?` · ${fail} failed`:''}${warn?` · ${warn} warnings`:''} (${pct}%)</span>`;
}
run();
</script></body></html>
