<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>MCP Debug</title>
<style>body{font-family:monospace;background:#0f1240;color:#fff;padding:24px;max-width:1100px;margin:0 auto;}
.r{background:rgba(255,255,255,0.05);padding:10px 14px;border-radius:6px;margin:6px 0;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:400px;overflow-y:auto;}
h3{color:#4db8ff;margin:14px 0 4px;}</style></head><body>
<h2 style="color:#4db8ff">MCP Debug — Raw Responses</h2>
<div id="out">Loading…</div>
<script>
const MCP = '/.netlify/functions/mcp';
async function rpc(method, params) {
  const body = JSON.stringify({ jsonrpc:'2.0', id:1, method, params });
  const r = await fetch(MCP, { method:'POST', headers:{'Content-Type':'application/json'}, body });
  const text = await r.text();
  return { status: r.status, raw: text };
}
async function run() {
  const out = document.getElementById('out');
  out.innerHTML = '';

  // get_bank_profile raw
  out.innerHTML += '<h3>get_bank_profile cert=23473 — raw response</h3>';
  let r = await rpc('tools/call', { name:'get_bank_profile', arguments:{ cert:'23473' } });
  out.innerHTML += `<div class="r">Status: ${r.status}\n\n${r.raw.slice(0,3000)}</div>`;

  // get_industry_metrics raw
  out.innerHTML += '<h3>get_industry_metrics — raw response</h3>';
  r = await rpc('tools/call', { name:'get_industry_metrics', arguments:{} });
  out.innerHTML += `<div class="r">Status: ${r.status}\n\n${r.raw.slice(0,3000)}</div>`;

  // What about with year?
  out.innerHTML += '<h3>get_industry_metrics year=2024</h3>';
  r = await rpc('tools/call', { name:'get_industry_metrics', arguments:{year:2024} });
  out.innerHTML += `<div class="r">Status: ${r.status}\n\n${r.raw.slice(0,3000)}</div>`;
}
run();
</script></body></html>
