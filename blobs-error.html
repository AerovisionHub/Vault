<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Blobs Error Diagnostic</title>
<style>body{font-family:monospace;background:#0f1240;color:#fff;padding:24px;max-width:1000px;margin:0 auto;}
.r{background:rgba(255,255,255,0.05);padding:10px 14px;border-radius:6px;margin:6px 0;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.pass{color:#4ade80;} .fail{color:#f87171;}
h3{color:#4db8ff;margin:14px 0 4px;}</style></head><body>
<h2 style="color:#4db8ff">Blobs Write — Surface the Error</h2>
<div id="out">Loading…</div>
<script>
async function run() {
  const r = await fetch('/.netlify/functions/blobs-diag');
  const text = await r.text();
  document.getElementById('out').innerHTML = `<h3>Status ${r.status}</h3><div class="r">${text}</div>`;
}
run();
</script></body></html>
