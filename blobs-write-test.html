<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Blobs Write Test</title>
<style>body{font-family:monospace;background:#0f1240;color:#fff;padding:24px;max-width:900px;margin:0 auto;}
.r{background:rgba(255,255,255,0.05);padding:10px 14px;border-radius:6px;margin:6px 0;font-size:11px;line-height:1.6;white-space:pre-wrap;}
h3{color:#4db8ff;}</style></head><body>
<h2 style="color:#4db8ff">Blobs Write Test</h2>
<p style="color:#9ca3af;font-size:12px;">Force an MCP call, then check if stats reflect it</p>
<div id="out">Loading…</div>
<script>
async function run() {
  const out = document.getElementById('out');
  out.innerHTML = '';

  // 1. Trigger an MCP call (this should write to Blobs)
  out.innerHTML += '<h3>Step 1: Trigger MCP search_institutions</h3>';
  const callTs = new Date().toISOString();
  const r1 = await fetch('/.netlify/functions/mcp', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ jsonrpc:'2.0', id:1, method:'tools/call', params:{ name:'search_institutions', arguments:{query:'Sutton Bank', limit:1} } })
  });
  const d1 = await r1.json();
  out.innerHTML += `<div class="r">Status: ${r1.status}\nCall returned: ${d1.result ? 'SUCCESS' : 'ERROR: '+JSON.stringify(d1.error)}\nTime: ${callTs}</div>`;

  // 2. Wait 3 seconds for the fire-and-forget Blobs write
  out.innerHTML += '<h3>Step 2: Waiting 3 sec for analytics write...</h3>';
  await new Promise(r => setTimeout(r, 3000));

  // 3. Pull stats again
  out.innerHTML += '<h3>Step 3: Check stats endpoint</h3>';
  const r2 = await fetch('/.netlify/functions/mcp-stats');
  const d2 = await r2.json();
  out.innerHTML += `<div class="r">Total calls in store: ${d2.all_time.total_calls}\nFull response:\n${JSON.stringify(d2, null, 2)}</div>`;

  // Conclusion
  out.innerHTML += '<h3>Diagnosis</h3>';
  if (d2.all_time.total_calls > 0) {
    out.innerHTML += '<div class="r" style="color:#4ade80">✓ Analytics ARE writing. Zero call count earlier means no one had used the MCP yet today.</div>';
  } else {
    out.innerHTML += '<div class="r" style="color:#f87171">✗ Analytics are NOT writing. The logCall function is silently failing inside fire-and-forget.</div>';
  }
}
run();
</script></body></html>
