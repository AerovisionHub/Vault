<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault MCP — Live Usage Stats</title>
<meta name="robots" content="noindex">
<style>
:root { --bg:#0f1240; --surface:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.12); --text:#fff; --muted:#8b95b3; --accent:#4db8ff; --accent2:#b06ef3; --green:#4ade80; --gold:#fbbf24; --red:#f87171; --serif:'Cormorant Garamond',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace; --sans:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif; }
* { box-sizing: border-box; }
body { margin:0; padding:0; background:linear-gradient(180deg,#0f1240 0%,#1a1060 50%,#2d1080 100%); color:var(--text); font-family:var(--sans); min-height:100vh; }
.container { max-width:1100px; margin:0 auto; padding:32px 20px 80px; }
.eyebrow { font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:8px; }
h1 { font-family:var(--serif); font-size:36px; margin:0 0 24px; letter-spacing:-1px; }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:32px; }
.kpi { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
.kpi .label { font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; }
.kpi .value { font-size:28px; font-weight:700; font-family:var(--serif); }
.kpi.accent .value { color:var(--accent); }
.kpi.green .value { color:var(--green); }
.kpi.gold .value { color:var(--gold); }
.kpi.red .value { color:var(--red); }
h2 { font-family:var(--serif); font-size:22px; margin:32px 0 14px; }
table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
th { font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; padding:12px 14px; text-align:left; border-bottom:1px solid var(--border); background:rgba(0,0,0,0.2); }
td { padding:11px 14px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.05); }
tr:last-child td { border-bottom:none; }
.bar { display:inline-block; height:6px; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:3px; vertical-align:middle; margin-left:8px; }
#loading { padding:60px 0; text-align:center; color:var(--muted); font-family:var(--mono); font-size:13px; }
#empty { padding:48px 0; text-align:center; color:var(--muted); }
#empty h3 { font-family:var(--serif); font-size:24px; color:var(--text); margin:0 0 10px; }
.refresh { float:right; padding:7px 14px; background:rgba(77,184,255,0.1); border:1px solid rgba(77,184,255,0.3); border-radius:8px; color:var(--accent); font-family:var(--mono); font-size:11px; cursor:pointer; }
</style></head><body>
<header style="display:flex;justify-content:space-between;align-items:flex-start;padding:24px 32px;flex-wrap:wrap;gap:14px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(15,18,64,0.4);">
  <div>
    <a href="/" style="cursor:pointer;text-decoration:none;display:block;color:#fff;">
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:600;letter-spacing:-1px;line-height:1;">Vault<span style="color:#4db8ff">.</span></div>
      <div style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;color:#8b95b3;letter-spacing:0.15em;text-transform:uppercase;margin-top:4px;">Bank &amp; Credit Union Intelligence</div>
    </a>
  </div>
  <nav class="vault-nav-desktop" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <a href="/industry" style="text-decoration:none;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:5px 11px;border-radius:6px;background:rgba(77,184,255,0.12);color:#4db8ff;border:1px solid rgba(77,184,255,0.25);">Industry</a>
    <a href="/lenders" style="text-decoration:none;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:5px 11px;border-radius:6px;background:rgba(74,222,128,0.12);color:#4ade80;border:1px solid rgba(74,222,128,0.25);">Find a Lender</a>
    <a href="/charters" style="text-decoration:none;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:5px 11px;border-radius:6px;background:rgba(251,191,36,0.12);color:#fbbf24;border:1px solid rgba(251,191,36,0.25);">New Charters</a>
    <a href="/compare" style="text-decoration:none;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:5px 11px;border-radius:6px;background:rgba(176,110,243,0.12);color:#b06ef3;border:1px solid rgba(176,110,243,0.25);">Compare</a>
    <a href="/mcp" style="text-decoration:none;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:5px 11px;border-radius:6px;background:linear-gradient(135deg,rgba(74,222,128,0.15),rgba(77,184,255,0.15));color:#4ade80;border:1px solid rgba(74,222,128,0.35);">MCP <span style="font-size:8px;background:#4ade80;color:#0f1240;padding:1px 4px;border-radius:3px;margin-left:3px;font-weight:700;">NEW</span></a>
    <a href="/ma" style="text-decoration:none;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:5px 11px;border-radius:6px;background:rgba(248,113,113,0.12);color:#f87171;border:1px solid rgba(248,113,113,0.25);">M&amp;A</a>
    <a href="/about" style="text-decoration:none;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:5px 11px;border-radius:6px;background:rgba(139,92,246,0.12);color:#c4b5fd;border:1px solid rgba(139,92,246,0.25);">About</a>
  </nav>
</header>
<style>
  @media (max-width: 720px) {
    .vault-nav-desktop { width: 100%; justify-content: flex-start; }
    .vault-nav-desktop a { font-size: 10px; padding: 4px 8px; }
    .container { padding: 24px 16px !important; }
    h1 { font-size: 24px !important; line-height: 1.2 !important; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
    .kpi-card { padding: 14px !important; }
    .kpi-value { font-size: 24px !important; }
    .section { padding: 18px !important; margin-bottom: 14px !important; }
    table { font-size: 11px !important; }
    table th, table td { padding: 8px 6px !important; }
    .bar { min-width: 40px !important; }
    body { overflow-x: hidden !important; }
    .refresh { font-size: 11px !important; padding: 5px 10px !important; }
  }
</style>

<div class="container">
  <div class="eyebrow">// Vault MCP Analytics</div>
  <h1>Live Usage Dashboard <button class="refresh" onclick="load()">Refresh</button></h1>
  <div id="content"><div id="loading">Loading stats…</div></div>
</div>
<script>
async function load() {
  const c = document.getElementById('content');
  c.innerHTML = '<div id="loading">Loading stats…</div>';
  try {
    const r = await fetch('/.netlify/functions/mcp-stats');
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    const all = d.all_time || {};
    if (!all.total_calls) {
      c.innerHTML = '<div id="empty"><h3>No usage yet.</h3><p>Once people start using Vault MCP, stats will appear here.</p><p style="font-family:var(--mono);font-size:11px;color:#666;margin-top:14px;">Endpoint: /.netlify/functions/mcp</p></div>';
      return;
    }
    const tools = Object.entries(all.tool_usage || {}).sort((a,b) => b[1]-a[1]);
    const clients = Object.entries(all.client_usage || {}).sort((a,b) => b[1]-a[1]);
    const maxTool = tools[0]?.[1] || 1;
    const maxClient = clients[0]?.[1] || 1;
    const html = `
      <div class="kpi-grid">
        <div class="kpi accent"><div class="label">Total tool calls</div><div class="value">${all.total_calls.toLocaleString()}</div></div>
        <div class="kpi green"><div class="label">Unique users</div><div class="value">${all.unique_users}</div></div>
        <div class="kpi gold"><div class="label">Active tools</div><div class="value">${tools.length}</div></div>
        <div class="kpi red"><div class="label">Error rate</div><div class="value">${all.error_rate}</div></div>
      </div>
      <h2>Tool usage</h2>
      <table><thead><tr><th>Tool</th><th>Calls</th><th>Distribution</th></tr></thead>
      <tbody>${tools.map(([t,n]) => `<tr><td style="font-family:var(--mono);color:var(--accent)">${t}</td><td>${n}</td><td><span class="bar" style="width:${(n/maxTool)*240}px"></span></td></tr>`).join('')}</tbody></table>
      <h2>MCP clients</h2>
      <table><thead><tr><th>Client</th><th>Sessions</th><th>Distribution</th></tr></thead>
      <tbody>${clients.map(([c,n]) => `<tr><td style="font-family:var(--mono);color:var(--accent)">${c}</td><td>${n}</td><td><span class="bar" style="width:${(n/maxClient)*240}px"></span></td></tr>`).join('')}</tbody></table>
      <h2>Daily breakdown (last 30 days)</h2>
      <table><thead><tr><th>Day</th><th>Calls</th><th>Unique users</th><th>Top tool</th><th>Top client</th><th>Errors</th></tr></thead>
      <tbody>${(d.daily||[]).map(day => `<tr><td style="font-family:var(--mono)">${day.day}</td><td>${day.calls}</td><td>${day.unique_users}</td><td style="font-family:var(--mono);color:var(--accent);font-size:11px">${day.top_tool||'—'}</td><td style="font-family:var(--mono);color:var(--accent2);font-size:11px">${day.top_client||'—'}</td><td style="color:${day.errors?'var(--red)':'var(--muted)'}">${day.errors}</td></tr>`).join('')}</tbody></table>
      <p style="margin-top:24px;font-family:var(--mono);font-size:10px;color:var(--muted)">Last updated: ${d.last_updated}</p>`;
    c.innerHTML = html;
  } catch(e) {
    c.innerHTML = `<div id="empty"><h3>Couldn't load stats</h3><p>${e.message}</p></div>`;
  }
}
load();
</script><footer style="margin-top:60px;padding:32px;border-top:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.2);text-align:center;">
  <div style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#8b95b3;line-height:1.8;max-width:720px;margin:0 auto;">
    Built by <a href="https://goidentify.com" target="_blank" style="color:#4db8ff;text-decoration:none;">iDENTIFY</a>
    &nbsp;·&nbsp;
    Data from <a href="https://banks.data.fdic.gov/" target="_blank" style="color:#8b95b3;text-decoration:underline;">FDIC</a> &amp; <a href="https://www.ncua.gov/" target="_blank" style="color:#8b95b3;text-decoration:underline;">NCUA</a>
    &nbsp;·&nbsp;
    <a href="/mcp" style="color:#8b95b3;text-decoration:underline;">MCP</a> &nbsp;·&nbsp; <a href="/about" style="color:#8b95b3;text-decoration:underline;">About</a>
    <br>
    <span style="font-size:10px;opacity:0.6;">Free banking intelligence. Open and free forever.</span>
  </div>
</footer>
</body></html>
