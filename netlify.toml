[build]
  publish = "."
  functions = "functions"
  command = "npm install"

# SPA routing — send all paths to index.html
[[redirects]]
  from = "/industry"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/lenders"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/charters"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ma"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/compare"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/bank/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/cu/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/wrapped/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/search-test"
  to = "/search-test.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200


# Short, pasteable MCP endpoint. The Claude "Add custom connector" flow asks
# people to type/paste a URL, and /.netlify/functions/mcp is long enough to be
# mistyped. This is a 200 rewrite, so method and body are preserved and the
# long URL keeps working for anyone already configured.
[[redirects]]
  from = "/api/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/mcp.html"
  status = 200

[[redirects]]
  from = "/mcp/setup"
  to = "/mcp-setup.html"
  status = 200

[[redirects]]
  from = "/mcp/stats"
  to = "/mcp-stats.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."mcp"]
  timeout = 26

[functions."leadership"]
  timeout = 26

# leadership-background: no timeout config needed/settable here — the
# "-background" filename suffix itself is what tells Netlify to run this as
# a fire-and-forget background function (immediate 202 response, up to 15
# min actual execution, no result read from its HTTP response). This is the
# whole point of its existence: the ~26s ceiling above is a hard platform
# limit for synchronous functions that no timeout config can raise further.
