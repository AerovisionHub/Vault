<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Stats Debug</title>
<style>body{font-family:monospace;background:#0f1240;color:#fff;padding:24px;max-width:1100px;margin:0 auto;}
.r{background:rgba(255,255,255,0.05);padding:12px 16px;border-radius:6px;margin:6px 0;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:400px;overflow-y:auto;}
h3{color:#4db8ff;margin:14px 0 4px;}</style></head><body>
<h2 style="color:#4db8ff">Stats Endpoint Debug</h2>
<div id="out">Loading…</div>
<script>
async function run() {
  const out = document.getElementById('out');
  out.innerHTML = '';
  try {
    const r = await fetch('/.netlify/functions/mcp-stats');
    const text = await r.text();
    out.innerHTML += `<h3>Status: ${r.status}</h3>`;
    out.innerHTML += `<div class="r">${text.slice(0, 4000)}</div>`;
  } catch(e) {
    out.innerHTML += `<div class="r">FETCH ERROR: ${e.message}</div>`;
  }
}
run();
</script></body></html>
